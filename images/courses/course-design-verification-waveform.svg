<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">RTL simulation timing waveforms</title>
  <desc id="desc">A timing viewer with a regular clock, active-low reset, valid and ready handshake pulses, and stable data and address buses.</desc>
  <defs>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#0c2541"/><stop offset="1" stop-color="#06172a"/></linearGradient>
    <linearGradient id="bar" x2="1"><stop stop-color="#102d4b"/><stop offset="1" stop-color="#0b213a"/></linearGradient>
    <clipPath id="round"><rect width="900" height="500" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="500" fill="url(#panel)"/>
    <rect width="900" height="58" fill="url(#bar)"/>
    <path d="M0 58H900" stroke="#244460"/>
    <circle cx="28" cy="29" r="6" fill="#37d69a"/>
