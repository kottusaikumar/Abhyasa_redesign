    <text x="855" y="34" fill="#8da9c4" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="end">Timing · 120 ns</text>
    <text x="34" y="83" fill="#88a5c2" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Signal</text>
    <text x="270" y="83" fill="#88a5c2" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Time (ns)</text>
    <path d="M240 68V476" stroke="#2a4966" stroke-width="1.5"/>
    <g fill="#7795b4" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">
      <text x="270" y="103">0</text><text x="367.5" y="103">20</text><text x="465" y="103">40</text><text x="562.5" y="103">60</text><text x="660" y="103">80</text><text x="757.5" y="103">100</text><text x="855" y="103">120</text>
    </g>
    <g stroke="#1a3651" stroke-width="1">
