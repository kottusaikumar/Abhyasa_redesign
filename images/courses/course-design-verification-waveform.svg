      <path d="M270 150V132H318.8V150H367.5V132H416.3V150H465V132H513.8V150H562.5V132H611.3V150H660V132H708.8V150H757.5V132H806.3V150H855V132" stroke="#45d7bf"/>
      <path d="M270 204H318.8V186H855" stroke="#f1c75b"/>
      <path d="M270 258H367.5V240H465V258H562.5V240H660V258H855" stroke="#35d18a"/>
      <path d="M270 312H367.5V294H660V312H855" stroke="#55b8ff"/>
      <path d="M270 357H357.5L367.5 345H455L465 357L475 369H552.5L562.5 357H650L660 369L670 357H855M270 357H357.5L367.5 369H455L465 357L475 345H552.5L562.5 357H650L660 345L670 357H855" stroke="#f1c75b"/>
