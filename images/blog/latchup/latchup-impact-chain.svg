<rect width="1000" height="560" rx="28" fill="url(#bg)"/><text x="54" y="65" fill="#15345f" font-family="Arial,sans-serif" font-size="25" font-weight="700">What latch-up can lead to</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g><rect x="45" y="145" width="205" height="250" rx="22" fill="#fff" stroke="#97c3fa" stroke-width="3"/><circle cx="148" cy="213" r="42" fill="#e3f0ff"/><path d="M148 174v78m-22-12 22 13 22-13" fill="none" stroke="#1676df" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="300" fill="#17345c" font-size="24" font-weight="700"><tspan x="148">Low-impedance</tspan><tspan x="148" dy="30">VDD-to-GND</tspan><tspan x="148" dy="30">path</tspan></text></g>
 <g><rect x="285" y="145" width="205" height="250" rx="22" fill="#fff" stroke="#ffb5a8" stroke-width="3"/><circle cx="388" cy="213" r="42" fill="#fff0eb"/><path d="M365 236h46M374 224l14-23 14 23m-14-23v45" fill="none" stroke="#e65e50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="388" y="300" fill="#17345c" font-size="24" font-weight="700"><tspan x="388">Excessive</tspan><tspan x="388" dy="30">current</tspan></text></g>
 <g><rect x="525" y="145" width="205" height="250" rx="22" fill="#fff" stroke="#ffc76e" stroke-width="3"/><circle cx="628" cy="213" r="42" fill="#fff5df"/><path d="M628 174c-20 28 14 29-4 52-14 17-30-1-22-17-22 18-15 48 12 50 29 2 44-30 26-52 0 14-12 12-12 0 0-10 9-16 0-33z" fill="#ed9c18"/><text x="628" y="300" fill="#17345c" font-size="24" font-weight="700"><tspan x="628">Power stress</tspan><tspan x="628" dy="30">and heating</tspan></text></g>
