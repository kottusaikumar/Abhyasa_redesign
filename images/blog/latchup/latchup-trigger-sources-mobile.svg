<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 780" role="img" aria-labelledby="t d"><title id="t">Latch-up trigger categories, narrow layout</title><desc id="d">Four source-listed categories in large vertically stacked cards: voltage spikes, ESD charge injection, radiation effects, and high well or substrate resistance.</desc><rect width="520" height="780" rx="24" fill="#eef7ff"/><text x="28" y="47" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17345c">Four trigger categories</text><g font-family="Arial,sans-serif" fill="#17345c"><rect x="28" y="74" width="464" height="153" rx="18" fill="#fff" stroke="#e6ad50" stroke-width="3"/><circle cx="76" cy="122" r="27" fill="#fff0ce"/><text x="76" y="131" text-anchor="middle" font-size="28" fill="#a96308">⚡</text><text x="120" y="126" font-size="25" font-weight="700">Voltage spikes</text><text x="46" y="173" font-size="20" fill="#425c78">Transient over/undershoot may</text><text x="46" y="203" font-size="20" fill="#425c78">forward-bias a junction.</text>
<rect x="28" y="245" width="464" height="153" rx="18" fill="#fff" stroke="#e58e93" stroke-width="3"/><circle cx="76" cy="293" r="27" fill="#ffe5e6"/><text x="76" y="302" text-anchor="middle" font-size="27" fill="#bb3e4b">02</text><text x="120" y="297" font-size="25" font-weight="700">ESD charge injection</text><text x="46" y="344" font-size="20" fill="#425c78">Injected charge can excite</text><text x="46" y="374" font-size="20" fill="#425c78">the parasitic structure.</text>
<rect x="28" y="416" width="464" height="153" rx="18" fill="#fff" stroke="#70bdb1" stroke-width="3"/><circle cx="76" cy="464" r="27" fill="#d9f5ee"/><text x="76" y="473" text-anchor="middle" font-size="27" fill="#0c8075">03</text><text x="120" y="468" font-size="25" font-weight="700">Radiation effects</text><text x="46" y="515" font-size="20" fill="#425c78">Charge generation is a</text><text x="46" y="545" font-size="20" fill="#425c78">context-dependent trigger.</text>
<rect x="28" y="587" width="464" height="153" rx="18" fill="#fff" stroke="#ab93dd" stroke-width="3"/><circle cx="76" cy="635" r="27" fill="#eee7ff"/><text x="76" y="644" text-anchor="middle" font-size="27" fill="#7051b7">04</text><text x="120" y="639" font-size="25" font-weight="700">High well/substrate R</text><text x="46" y="686" font-size="20" fill="#425c78">Resistance can raise local bias</text><text x="46" y="716" font-size="20" fill="#425c78">during carrier injection.</text></g></svg>
