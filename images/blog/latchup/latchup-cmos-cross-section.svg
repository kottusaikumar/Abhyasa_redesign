<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="t d"><title id="t">Parasitic transistors in P-substrate and N-well CMOS</title><desc id="d">Conceptual not-to-scale P-substrate and N-well CMOS cross-section. PMOS P-plus diffusion, N-well, and P-substrate form a vertical parasitic PNP. NMOS N-plus diffusion, P-substrate, and N-well form a lateral parasitic NPN. The well tie connects to VDD and substrate tie to ground.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".65"/></pattern></defs><rect width="1200" height="740" rx="26" fill="url(#bg)"/><text x="42" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#17345c">P-substrate / N-well CMOS · conceptual, not to scale</text>
<rect x="70" y="500" width="1060" height="170" rx="8" fill="#f8c7c3" stroke="#c86d71" stroke-width="3"/><rect x="70" y="500" width="1060" height="170" rx="8" fill="url(#dots)"/><text x="600" y="632" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#803f57">P-substrate · NPN base / PNP collector</text>
<rect x="110" y="260" width="560" height="240" rx="20" fill="#c6eee1" stroke="#4eaa8d" stroke-width="4"/><rect x="110" y="260" width="560" height="240" rx="20" fill="url(#dots)"/><text x="390" y="294" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#116d5e">N-well · PNP base / NPN collector</text>
<!-- device gates -->
<rect x="195" y="333" width="280" height="24" rx="4" fill="#7a5bc5"/><rect x="195" y="357" width="280" height="16" fill="#d5c8f5"/><text x="335" y="324" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#4b3689">PMOS gate / oxide</text>
<rect x="740" y="333" width="280" height="24" rx="4" fill="#158f9c"/><rect x="740" y="357" width="280" height="16" fill="#b9e9e8"/><text x="880" y="324" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#126977">NMOS gate / oxide</text>
<!-- P+ PMOS terminal, N+ well tap -->
<rect x="140" y="375" width="115" height="82" rx="9" fill="#d99af0" stroke="#9454b5" stroke-width="3"/><text x="198" y="415" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#55286c">P+</text><text x="198" y="442" text-anchor="middle" font-family="Arial" font-size="16" fill="#55286c">PMOS S/D</text>
<rect x="555" y="320" width="70" height="115" rx="8" fill="#85d99c" stroke="#32985b" stroke-width="3"/><text x="590" y="371" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1c693b">N+</text><text x="590" y="397" text-anchor="middle" font-family="Arial" font-size="14" fill="#1c693b">well tie</text>
<!-- N+ NMOS terminal, P+ substrate tap -->
<rect x="820" y="375" width="120" height="82" rx="9" fill="#75d7d4" stroke="#148a91" stroke-width="3"/><text x="880" y="415" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#095c66">N+</text><text x="880" y="442" text-anchor="middle" font-family="Arial" font-size="16" fill="#095c66">NMOS S/D</text>
<rect x="1040" y="500" width="62" height="93" rx="8" fill="#ffbf83" stroke="#c77c27" stroke-width="3"/><text x="1071" y="541" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7e4a11">P+</text><text x="1071" y="566" text-anchor="middle" font-family="Arial" font-size="13" fill="#7e4a11">substrate tie</text>
<!-- rails and resistive paths -->
<path d="M590 320V135H520" fill="none" stroke="#25915b" stroke-width="5"/><rect x="438" y="94" width="165" height="45" rx="18" fill="#e2f7e9" stroke="#86cba0"/><text x="520" y="124" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17653b">VDD · N-well tie</text>
<path d="M1071 500V142h-80" fill="none" stroke="#d98126" stroke-width="5"/><rect x="912" y="101" width="180" height="45" rx="18" fill="#fff1df" stroke="#efc27e"/><text x="1002" y="131" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#8e5512">GND · P-sub tie</text>
<path d="M670 278h55m-48-12 10 12-10 12m28-12 10 12-10 12" fill="none" stroke="#ed9c18" stroke-width="4"/><text x="697" y="252" text-anchor="middle" font-family="Arial" font-size="16" fill="#985d17">Rwell</text>
<path d="M945 482h62m-55-12 10 12-10 12m28-12 10 12-10 12" fill="none" stroke="#0873d8" stroke-width="4"/><text x="976" y="463" text-anchor="middle" font-family="Arial" font-size="16" fill="#145690">Rsub</text>
<!-- device association labels -->
<rect x="75" y="190" width="310" height="48" rx="20" fill="#f2eaff" stroke="#c4b1ec"/><text x="230" y="221" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#553c8f">Vertical parasitic PNP · P+ / N-well / P-sub</text>
<rect x="710" y="190" width="390" height="48" rx="20" fill="#e5f7f5" stroke="#9edbd5"/><text x="905" y="221" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#116c70">Lateral parasitic NPN · N+ / P-sub / N-well</text>
<text x="600" y="710" text-anchor="middle" font-family="Arial" font-size="16" fill="#4d6785">Simplified bulk CMOS cross-section; transistor terminals and spacing are schematic</text></svg>
