<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">End-cap cells at standard-cell row boundaries</title><desc id="d">Two standard-cell rows terminate at end-cap cells on either side of a macro interruption. Endcaps are visually distinct from the separately shown well-tap cells; exact endcap function depends on the library and process.</desc><defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf7ff"/></linearGradient></defs><rect width="1200" height="470" rx="24" fill="url(#b)"/><text x="48" y="56" font-family="Arial" font-size="25" font-weight="700" fill="#17345c">Standard-cell row edges · conceptual floorplan view</text>
<g transform="translate(70 100)" font-family="Arial"><text x="0" y="50" fill="#526b88" font-size="18" font-weight="700">ROW A</text><text x="0" y="202" fill="#526b88" font-size="18" font-weight="700">ROW B</text>
<g><rect x="125" y="18" width="70" height="88" rx="8" fill="#e6e0fa" stroke="#8b78c8" stroke-width="3"/><text x="160" y="69" text-anchor="middle" fill="#4b3c80" font-size="15" font-weight="700">ENDCAP</text><rect x="195" y="18" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="365" y="18" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="535" y="18" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="705" y="18" width="70" height="88" rx="8" fill="#e6e0fa" stroke="#8b78c8" stroke-width="3"/><text x="440" y="73" text-anchor="middle" fill="#244870" font-size="20" font-weight="700">Standard cells</text><text x="160" y="38" text-anchor="middle" fill="#4b3c80" font-size="12">ROW EDGE</text><text x="740" y="38" text-anchor="middle" fill="#4b3c80" font-size="12">ROW EDGE</text></g>
<g><rect x="125" y="170" width="70" height="88" rx="8" fill="#e6e0fa" stroke="#8b78c8" stroke-width="3"/><rect x="195" y="170" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="365" y="170" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="535" y="170" width="170" height="88" rx="8" fill="#dceafb" stroke="#72a2da" stroke-width="2"/><rect x="705" y="170" width="70" height="88" rx="8" fill="#e6e0fa" stroke="#8b78c8" stroke-width="3"/></g>
<rect x="830" y="-10" width="205" height="300" rx="12" fill="#fff0df" stroke="#e5a34b" stroke-width="3" stroke-dasharray="10 7"/><text x="932" y="128" text-anchor="middle" fill="#895413" font-size="23" font-weight="700">Macro /</text><text x="932" y="159" text-anchor="middle" fill="#895413" font-size="23" font-weight="700">row interruption</text>
<g transform="translate(125 320)"><rect width="26" height="26" rx="5" fill="#e6e0fa" stroke="#8b78c8" stroke-width="2"/><text x="40" y="20" fill="#4b3c80" font-size="17" font-weight="700">Endcap · row-edge physical-only cell</text><rect x="492" width="26" height="26" rx="5" fill="#d4f2de" stroke="#33965c" stroke-width="2"/><text x="532" y="20" fill="#267547" font-size="17" font-weight="700">Well tap · separate contact function</text></g></g>
<rect x="120" y="402" width="960" height="42" rx="18" fill="#fff" stroke="#d7e6f5"/><text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#3f5877">Endcaps do not automatically provide a well/substrate tie; details are library/process dependent.</text></svg>
