<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Latch-up trigger categories</title><desc id="d">Four categories listed in the article: voltage spikes, electrostatic discharge, radiation effects, and high substrate or well resistance. The diagram gives categories only and no trigger thresholds.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient></defs><rect width="1000" height="560" rx="26" fill="url(#b)"/><text x="48" y="57" font-family="Arial" font-size="25" font-weight="700" fill="#17345c">Four source-listed trigger categories</text>
<g font-family="Arial" fill="#17345c"><g transform="translate(45 105)"><rect width="435" height="170" rx="20" fill="#fff" stroke="#efbd68" stroke-width="3"/><circle cx="78" cy="84" r="46" fill="#fff3d9"/><path d="M78 50v68m-17-17 17 18 17-18" fill="none" stroke="#d88916" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="75" font-size="23" font-weight="700">Voltage spikes</text><text x="148" y="108" font-size="17" fill="#526b88">Transient over/undershoot may</text><text x="148" y="134" font-size="17" fill="#526b88">forward-bias a parasitic junction.</text></g>
<g transform="translate(520 105)"><rect width="435" height="170" rx="20" fill="#fff" stroke="#f0a1a3" stroke-width="3"/><circle cx="78" cy="84" r="46" fill="#fff0ef"/><path d="M80 43 55 88h22l-8 38 34-53H81z" fill="#e25c5d"/><text x="148" y="75" font-size="23" font-weight="700">ESD charge injection</text><text x="148" y="108" font-size="17" fill="#526b88">Injected charge can excite</text><text x="148" y="134" font-size="17" fill="#526b88">the parasitic structure.</text></g>
<g transform="translate(45 310)"><rect width="435" height="170" rx="20" fill="#fff" stroke="#93c9c1" stroke-width="3"/><circle cx="78" cy="84" r="46" fill="#e6f7f3"/><circle cx="78" cy="84" r="9" fill="#138e83"/><path d="M78 50v15m0 38v15M44 84h15m38 0h15M54 60l11 11m26 26 11 11m0-48L96 71M60 108l11-11" stroke="#138e83" stroke-width="5" stroke-linecap="round"/><text x="148" y="75" font-size="23" font-weight="700">Radiation effects</text><text x="148" y="108" font-size="17" fill="#526b88">Charge generation is a context-</text><text x="148" y="134" font-size="17" fill="#526b88">dependent trigger mechanism.</text></g>
<g transform="translate(520 310)"><rect width="435" height="170" rx="20" fill="#fff" stroke="#b6a5e6" stroke-width="3"/><circle cx="78" cy="84" r="46" fill="#f0ebff"/><path d="M53 60h50v48H53z" fill="none" stroke="#7354c8" stroke-width="5"/><path d="M62 72h33m-33 12h25m-25 12h29" stroke="#7354c8" stroke-width="4" stroke-linecap="round"/><text x="148" y="75" font-size="23" font-weight="700">High well / substrate R</text><text x="148" y="108" font-size="17" fill="#526b88">Resistance can increase local</text><text x="148" y="134" font-size="17" fill="#526b88">bias during carrier injection.</text></g></g></svg>
