<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-labelledby="t d"><title id="t">Latch-up impact pathway, narrow layout</title><desc id="d">Four large stacked stages: low-impedance VDD-to-GND path, excessive current, power stress and heating, and possible circuit damage.</desc><rect width="520" height="760" rx="24" fill="#eef7ff"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17345c">What latch-up can lead to</text><g font-family="Arial,sans-serif" fill="#17345c" font-size="24" font-weight="700"><rect x="28" y="80" width="464" height="126" rx="18" fill="#fff" stroke="#80b7f1" stroke-width="3"/><circle cx="88" cy="143" r="36" fill="#e0efff"/><text x="88" y="152" text-anchor="middle" fill="#166cd4" font-size="28">01</text><text x="145" y="135">Low-impedance</text><text x="145" y="169">VDD-to-GND path</text><path d="M260 209v25" stroke="#627d9a" stroke-width="5"/>
<rect x="28" y="240" width="464" height="108" rx="18" fill="#fff" stroke="#ee9d99" stroke-width="3"/><circle cx="88" cy="294" r="36" fill="#fff0ee"/><text x="88" y="303" text-anchor="middle" fill="#ce4f50" font-size="28">02</text><text x="145" y="302">Excessive current</text><path d="M260 351v25" stroke="#627d9a" stroke-width="5"/>
<rect x="28" y="382" width="464" height="108" rx="18" fill="#fff" stroke="#ecc16b" stroke-width="3"/><circle cx="88" cy="436" r="36" fill="#fff3d9"/><text x="88" y="445" text-anchor="middle" fill="#a3630b" font-size="28">03</text><text x="145" y="428">Power stress</text><text x="145" y="462">and heating</text><path d="M260 493v25" stroke="#627d9a" stroke-width="5"/>
<rect x="28" y="524" width="464" height="108" rx="18" fill="#fff" stroke="#b7a1e8" stroke-width="3"/><circle cx="88" cy="578" r="36" fill="#eee7ff"/><text x="88" y="587" text-anchor="middle" fill="#7654ba" font-size="28">04</text><text x="145" y="570">Possible circuit</text><text x="145" y="604">damage</text></g><rect x="28" y="659" width="464" height="74" rx="15" fill="#fff" stroke="#c9dff2"/><text x="48" y="688" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315270">Conceptual sequence</text><text x="48" y="716" font-family="Arial,sans-serif" font-size="18" fill="#4d6682">Severity depends on device and supply.</text></svg>
