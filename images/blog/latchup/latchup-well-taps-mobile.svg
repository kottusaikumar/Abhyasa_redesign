<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 770" role="img" aria-labelledby="t d"><title id="t">Well and substrate taps, narrow layout</title><desc id="d">First panel shows N-plus N-well contact tied to VDD and P-plus substrate contact tied to ground in conventional bulk CMOS. Second panel shows tap cells periodically inserted between standard-cell rows, with spacing determined by foundry rules.</desc><rect width="520" height="770" rx="24" fill="#eef7ff"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17345c">Well and substrate taps</text><g font-family="Arial,sans-serif" fill="#17345c"><rect x="24" y="70" width="472" height="332" rx="18" fill="#fff" stroke="#c9ddec" stroke-width="2"/><text x="44" y="110" font-size="24" font-weight="700">A · Tie contacts</text><rect x="44" y="155" width="432" height="198" rx="11" fill="#f6c8c2" stroke="#c97075" stroke-width="3"/><text x="245" y="339" text-anchor="middle" font-size="21" font-weight="700" fill="#854758">P-substrate</text><rect x="66" y="189" width="220" height="127" rx="12" fill="#c5eee1" stroke="#4eaa8d" stroke-width="3"/><text x="176" y="219" text-anchor="middle" font-size="22" font-weight="700" fill="#166b5a">N-well</text><rect x="105" y="252" width="58" height="57" rx="7" fill="#7ed89b" stroke="#328d55" stroke-width="2"/><text x="134" y="287" text-anchor="middle" font-size="20" font-weight="700">N+</text><rect x="383" y="291" width="54" height="55" rx="7" fill="#ffbd80" stroke="#b97527" stroke-width="2"/><text x="410" y="325" text-anchor="middle" font-size="20" font-weight="700">P+</text><path d="M134 252V143H72M410 291V143h-57" fill="none" stroke="#446d78" stroke-width="4"/><text x="45" y="137" font-size="20" font-weight="700" fill="#277346">VDD</text><text x="357" y="137" font-size="20" font-weight="700" fill="#92580c">GND</text><text x="48" y="379" font-size="18" fill="#425e78">N+ well tie · P+ substrate tie</text>
<rect x="24" y="422" width="472" height="315" rx="18" fill="#fff" stroke="#c9ddec" stroke-width="2"/><text x="44" y="462" font-size="24" font-weight="700">B · Tap cells in rows</text><rect x="46" y="490" width="428" height="174" rx="10" fill="#eef5fe" stroke="#95b8dc" stroke-width="2"/><g fill="#d3e5fa" stroke="#6496c9" stroke-width="2"><rect x="62" y="510" width="86" height="55" rx="5"/><rect x="162" y="510" width="86" height="55" rx="5"/><rect x="262" y="510" width="86" height="55" rx="5"/><rect x="362" y="510" width="92" height="55" rx="5"/><rect x="62" y="584" width="86" height="55" rx="5"/><rect x="162" y="584" width="86" height="55" rx="5"/><rect x="262" y="584" width="86" height="55" rx="5"/><rect x="362" y="584" width="92" height="55" rx="5"/></g><g fill="#9be4ad" stroke="#238457" stroke-width="2"><rect x="149" y="500" width="13" height="72" rx="3"/><rect x="349" y="500" width="13" height="72" rx="3"/><rect x="149" y="574" width="13" height="72" rx="3"/><rect x="349" y="574" width="13" height="72" rx="3"/></g><text x="49" y="695" font-size="19" fill="#405c77">Green strips = periodic tap cells</text><text x="49" y="722" font-size="18" fill="#405c77">Spacing follows foundry rules.</text></g></svg>
