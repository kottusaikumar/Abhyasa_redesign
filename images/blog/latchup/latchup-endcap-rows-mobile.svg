<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" role="img" aria-labelledby="t d"><title id="t">Endcap cells at row boundaries, narrow layout</title><desc id="d">Standard-cell rows terminate in purple endcap cells on either side of a macro interruption. A green well tap is distinguished from the physical-only endcaps; exact functions depend on the library and process.</desc><rect width="520" height="680" rx="24" fill="#eef7ff"/><text x="24" y="43" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17345c">Endcaps at row edges</text><text x="24" y="72" font-family="Arial,sans-serif" font-size="19" fill="#425e78">Conceptual floorplan view</text><g font-family="Arial,sans-serif"><rect x="208" y="118" width="104" height="271" rx="12" fill="#fff0dc" stroke="#d99c44" stroke-width="3" stroke-dasharray="8 5"/><text x="260" y="238" text-anchor="middle" font-size="23" font-weight="700" fill="#875211">Macro</text><text x="260" y="270" text-anchor="middle" font-size="18" fill="#875211">row gap</text><text x="28" y="113" font-size="21" font-weight="700" fill="#17345c">Row A</text><text x="28" y="260" font-size="21" font-weight="700" fill="#17345c">Row B</text>
<g fill="#d5e6fb" stroke="#6799ca" stroke-width="2"><rect x="60" y="135" width="65" height="82" rx="5"/><rect x="125" y="135" width="55" height="82" rx="5"/><rect x="340" y="135" width="55" height="82" rx="5"/><rect x="395" y="135" width="65" height="82" rx="5"/><rect x="60" y="282" width="65" height="82" rx="5"/><rect x="125" y="282" width="55" height="82" rx="5"/><rect x="340" y="282" width="55" height="82" rx="5"/><rect x="395" y="282" width="65" height="82" rx="5"/></g><g fill="#e6dcfa" stroke="#8c71c5" stroke-width="3"><rect x="28" y="135" width="32" height="82" rx="5"/><rect x="180" y="135" width="28" height="82" rx="5"/><rect x="312" y="135" width="28" height="82" rx="5"/><rect x="460" y="135" width="32" height="82" rx="5"/><rect x="28" y="282" width="32" height="82" rx="5"/><rect x="180" y="282" width="28" height="82" rx="5"/><rect x="312" y="282" width="28" height="82" rx="5"/><rect x="460" y="282" width="32" height="82" rx="5"/></g><rect x="118" y="282" width="14" height="82" rx="4" fill="#9de5b0" stroke="#288b5a" stroke-width="2"/><text x="28" y="427" font-size="20" font-weight="700" fill="#17345c">Cell types</text><rect x="28" y="449" width="31" height="31" rx="5" fill="#e6dcfa" stroke="#8c71c5" stroke-width="2"/><text x="75" y="473" font-size="21" fill="#49397f">Endcap · row-edge cell</text><rect x="28" y="496" width="31" height="31" rx="5" fill="#9de5b0" stroke="#288b5a" stroke-width="2"/><text x="75" y="520" font-size="21" fill="#176746">Well tap · separate contact</text><rect x="24" y="558" width="472" height="93" rx="14" fill="#fff" stroke="#c8dbea"/><text x="43" y="589" font-size="19" font-weight="700" fill="#17345c">Endcap ≠ well tap</text><text x="43" y="619" font-size="18" fill="#46617c">Exact edge-cell function depends</text><text x="43" y="643" font-size="18" fill="#46617c">on library and process.</text></g></svg>
