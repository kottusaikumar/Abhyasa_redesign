<!-- The quiet split connector denotes relevance of transferable skills, not a production flow. -->
<path d="M909 277h94c34 0 33-67 70-67h30M1003 277c34 0 33 86 70 86h30" fill="none" stroke="#5c9ca2" stroke-width="5" stroke-linecap="round"/>
