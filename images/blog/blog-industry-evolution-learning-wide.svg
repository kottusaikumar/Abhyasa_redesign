 <rect x="683" y="190" width="158" height="119" rx="13" fill="url(#layout)" stroke="#5d9b89"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="#102d62"><text x="390" y="238">RTL</text><text x="576" y="238">VERIFY</text><text x="762" y="238">LAYOUT</text></g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
