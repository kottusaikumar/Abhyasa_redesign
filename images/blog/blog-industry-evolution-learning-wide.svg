<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 561" role="img" aria-labelledby="title desc">
<title id="title">Practical semiconductor learning and evolving applications</title>
<desc id="desc">An RTL, verification and layout learning exercise appears on a large digital design display. Fine lines relate the learned skills to AI and cloud computing and to automotive electronics, without implying that this project becomes those products.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#f1f4ee"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#f7fbfc"/><stop offset="1" stop-color="#e6f0f2"/></linearGradient>
 <linearGradient id="rtl" x2="0" y2="1"><stop stop-color="#e6f4ff"/><stop offset="1" stop-color="#c7e0f3"/></linearGradient>
 <linearGradient id="sim" x2="0" y2="1"><stop stop-color="#f3ebfa"/><stop offset="1" stop-color="#ddd0ed"/></linearGradient>
 <linearGradient id="layout" x2="0" y2="1"><stop stop-color="#e9f7f1"/><stop offset="1" stop-color="#c6e4d8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#355364" flood-opacity=".13"/></filter>
</defs>
<rect width="1740" height="561" fill="url(#paper)"/>
<path d="M0 479c210-35 374-7 574 15 208 23 366-33 537-26 183 8 383 29 629 1v92H0z" fill="#e8efea" opacity=".6"/>
<g fill="none" stroke="#d7e0da" stroke-width="2" opacity=".8"><path d="M65 76h205M1511 76h165"/><circle cx="280" cy="76" r="4"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#102d62" font-weight="700">
 <text x="92" y="91" font-size="46" letter-spacing="1">PRACTICAL LEARNING</text>
 <text x="1133" y="91" font-size="43" letter-spacing="1">EVOLVING APPLICATIONS</text>
</g>

<!-- A conceptual student exercise, not a replica of a commercial EDA interface. -->
