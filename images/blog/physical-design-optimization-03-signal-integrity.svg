<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
 <title id="title">Signal integrity and crosstalk</title><desc id="desc">Two adjacent signal routes show capacitive coupling from an aggressor toward a victim. A grounded shield is shown in a separate routing example, with placement and routing considerations.</desc>
 <defs><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f8fd"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#d97579"/></marker></defs>
 <rect x="1" y="1" width="758" height="498" rx="22" fill="url(#panel)" stroke="#d9e8f5" stroke-width="2"/><text x="42" y="53" fill="#15345c" font-family="Arial,sans-serif" font-size="22" font-weight="700">Closely spaced routes can affect signal quality</text><text x="42" y="82" fill="#607b98" font-family="Arial,sans-serif" font-size="14">Simplified interconnect illustration</text>
 <rect x="48" y="111" width="664" height="176" rx="15" fill="#fff" stroke="#dce9f5"/><text x="75" y="145" fill="#45627f" font-family="Arial,sans-serif" font-size="13" font-weight="700">ADJACENT CONDUCTORS</text>
 <path d="M83 190h588" stroke="#247fca" stroke-width="18" stroke-linecap="round"/><path d="M83 245h588" stroke="#7d62c8" stroke-width="18" stroke-linecap="round"/><circle cx="119" cy="190" r="5" fill="#fff"/><circle cx="635" cy="190" r="5" fill="#fff"/><text x="84" y="174" fill="#25699f" font-family="Arial,sans-serif" font-size="13" font-weight="700">Aggressor route</text><text x="84" y="273" fill="#6850a8" font-family="Arial,sans-serif" font-size="13" font-weight="700">Victim route</text>
 <path d="M275 199v24m0-24 12 12m-12-12-12 12M380 199v24m0-24 12 12m-12-12-12 12M485 199v24m0-24 12 12m-12-12-12 12" fill="none" stroke="#d97579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="380" y="237" text-anchor="middle" fill="#9b555a" font-family="Arial,sans-serif" font-size="12">coupling / crosstalk</text>
 <text x="49" y="326" fill="#15345c" font-family="Arial,sans-serif" font-size="17" font-weight="700">Design responses described in the article</text>
 <g><rect x="48" y="346" width="202" height="108" rx="13" fill="#eaf4ff" stroke="#cfe3f5"/><circle cx="83" cy="382" r="18" fill="#d4eaff"/><path d="M72 382h22m-11-11v22" stroke="#277bcc" stroke-width="3" stroke-linecap="round"/><text x="111" y="378" fill="#24496e" font-family="Arial,sans-serif" font-size="13" font-weight="700">Optimize routing</text><text x="70" y="421" fill="#5a7691" font-family="Arial,sans-serif" font-size="12">Plan wire paths carefully</text></g>
 <g><rect x="279" y="346" width="202" height="108" rx="13" fill="#e9f7ef" stroke="#d1ebdc"/><path d="M315 366v42" stroke="#378c5a" stroke-width="10"/><path d="M303 382h24m-24 10h24" stroke="#fff" stroke-width="2"/><text x="343" y="378" fill="#2e6547" font-family="Arial,sans-serif" font-size="13" font-weight="700">Use shielding</text><text x="301" y="421" fill="#5a7d68" font-family="Arial,sans-serif" font-size="12">Separate sensitive routes</text></g>
 <g><rect x="510" y="346" width="202" height="108" rx="13" fill="#fff2e2" stroke="#f0dfc7"/><rect x="531" y="368" width="22" height="22" rx="4" fill="#f3c982"/><rect x="559" y="368" width="22" height="22" rx="4" fill="#9ad5b1"/><rect x="587" y="368" width="22" height="22" rx="4" fill="#c6b2ef"/><text x="620" y="378" fill="#755528" font-family="Arial,sans-serif" font-size="13" font-weight="700">Plan placement</text><text x="532" y="421" fill="#87704b" font-family="Arial,sans-serif" font-size="12">Reduce unwanted proximity</text></g>
