  <title id="title">Target utilization retained when module shapes change</title>
  <desc id="desc">Modules SH19 and SH7 are reshaped from tall rectangles to wider rectangles. Both remain at TU=77.2 percent.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#0873f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="800" height="450" rx="18" fill="url(#canvas)"/>
  <text x="200" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#102a55">Original module shapes</text>
  <text x="600" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#102a55">Reshaped modules · same area</text>
  <rect x="78" y="116" width="110" height="205" rx="8" fill="url(#blueFill)" stroke="#0873f9" stroke-width="3"/>
  <rect x="242" y="116" width="110" height="205" rx="8" fill="url(#coralFill)" stroke="#0873f9" stroke-width="3"/>
  <text x="133" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#102a55">SH19</text><text x="297" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#102a55">SH7</text>
  <text x="133" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#087C62">TU=77.2%</text><text x="297" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#087C62">TU=77.2%</text>
  <path d="M382 218h42" stroke="#0873f9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="153" width="205" height="110" rx="8" fill="url(#blueFill)" stroke="#0873f9" stroke-width="3"/>
  <rect x="470" y="278" width="205" height="110" rx="8" fill="url(#coralFill)" stroke="#0873f9" stroke-width="3"/>
  <text x="572" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#102a55">SH19</text><text x="572" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#087C62">TU=77.2%</text>
