<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc"><defs><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FCFF"/><stop offset="0.55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#E5F3FF"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F9FF"/></linearGradient><linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8E6FF"/><stop offset="1" stop-color="#8BC5FF"/></linearGradient><linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8F4FA"/><stop offset="1" stop-color="#75D5E7"/></linearGradient><linearGradient id="mintFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7F8E8"/><stop offset="1" stop-color="#8EE2B9"/></linearGradient><linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAB8"/><stop offset="1" stop-color="#FFC86B"/></linearGradient><linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DDFF"/><stop offset="1" stop-color="#B99BFF"/></linearGradient><linearGradient id="coralFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE1DC"/><stop offset="1" stop-color="#FFAAA2"/></linearGradient><filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#346da5" flood-opacity="0.12"/></filter><linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1557C0"/><stop offset="1" stop-color="#0D43AE"/></linearGradient><linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF6DF"/><stop offset="1" stop-color="#7AD9A5"/></linearGradient><linearGradient id="lavenderFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DCFF"/><stop offset="1" stop-color="#B99CFA"/></linearGradient></defs>
  <title id="title">Instance grouping hierarchy before and after</title>
  <desc id="desc">Stacked mobile comparison. Before grouping, TOP branches to A and D, with B and C under A and E and F under D. After grouping, TOP branches to A, D and group_A; C remains under A, E under D, and B and F are children of group_A.</desc>
  <rect width="720" height="920" rx="18" fill="url(#canvas)"/>
  <text x="360" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102a55">Before grouping</text>
  <g stroke="#55789F" stroke-width="3" fill="none"><path d="M360 112L250 178M360 112L470 178M250 232L190 304M250 232L310 304M470 232L410 304M470 232L530 304"/><path d="M360 522L220 592M360 522L360 592M360 522L500 592M220 646L220 720M360 646L360 720M500 646L470 720M500 646L530 720"/></g>
  <text x="360" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0873f9">After grouping</text>
  <g font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#102a55">
    <circle cx="360" cy="90" r="32" fill="url(#blueFill)" stroke="#0873f9" stroke-width="2"/><circle cx="250" cy="205" r="29" fill="url(#mintFill)" stroke="#247B58" stroke-width="2"/><circle cx="470" cy="205" r="29" fill="url(#mintFill)" stroke="#247B58" stroke-width="2"/><circle cx="310" cy="330" r="27" fill="url(#cyanFill)" stroke="#257B92" stroke-width="2"/><circle cx="410" cy="330" r="27" fill="url(#cyanFill)" stroke="#257B92" stroke-width="2"/><g fill="url(#amberFill)" stroke="#A96B13" stroke-width="2"><circle cx="190" cy="330" r="27"/><circle cx="530" cy="330" r="27"/></g>
    <text x="360" y="98">TOP</text><text x="250" y="213">A</text><text x="470" y="213">D</text><text x="190" y="338">B</text><text x="310" y="338">C</text><text x="410" y="338">E</text><text x="530" y="338">F</text>
    <circle cx="360" cy="500" r="32" fill="url(#blueFill)" stroke="#0873f9" stroke-width="2"/><circle cx="220" cy="620" r="29" fill="url(#mintFill)" stroke="#247B58" stroke-width="2"/><circle cx="360" cy="620" r="29" fill="url(#mintFill)" stroke="#247B58" stroke-width="2"/><circle cx="220" cy="746" r="27" fill="url(#cyanFill)" stroke="#257B92" stroke-width="2"/><circle cx="360" cy="746" r="27" fill="url(#cyanFill)" stroke="#257B92" stroke-width="2"/><g fill="url(#violetFill)" stroke="#6650AA" stroke-width="2"><rect x="442" y="592" width="116" height="56" rx="27"/></g><g fill="url(#amberFill)" stroke="#A96B13" stroke-width="2"><circle cx="470" cy="746" r="27"/><circle cx="530" cy="746" r="27"/></g>
    <text x="360" y="508">TOP</text><text x="220" y="628">A</text><text x="360" y="628">D</text><text x="220" y="754">C</text><text x="360" y="754">E</text><text x="500" y="628" font-size="19">group_A</text><text x="470" y="754">B</text><text x="530" y="754">F</text>
  </g>
</svg>
