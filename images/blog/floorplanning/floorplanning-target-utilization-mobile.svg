<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 720" role="img" aria-labelledby="title desc"><defs><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FCFF"/><stop offset="0.55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#E5F3FF"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F9FF"/></linearGradient><linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8E6FF"/><stop offset="1" stop-color="#8BC5FF"/></linearGradient><linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8F4FA"/><stop offset="1" stop-color="#75D5E7"/></linearGradient><linearGradient id="mintFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7F8E8"/><stop offset="1" stop-color="#8EE2B9"/></linearGradient><linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAB8"/><stop offset="1" stop-color="#FFC86B"/></linearGradient><linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DDFF"/><stop offset="1" stop-color="#B99BFF"/></linearGradient><linearGradient id="coralFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE1DC"/><stop offset="1" stop-color="#FFAAA2"/></linearGradient><filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#346da5" flood-opacity="0.12"/></filter><linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1557C0"/><stop offset="1" stop-color="#0D43AE"/></linearGradient><linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF6DF"/><stop offset="1" stop-color="#7AD9A5"/></linearGradient><linearGradient id="lavenderFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DCFF"/><stop offset="1" stop-color="#B99CFA"/></linearGradient></defs>
  <title id="title">Target utilization retained when module shapes change</title>
  <desc id="desc">SH19 and SH7 each show TU=77.2 percent before and after reshaping. The before blocks are tall; the after blocks are wider with the same area.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#0873f9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="620" height="720" rx="18" fill="url(#canvas)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="310" y="54" font-size="27" font-weight="700" fill="#102a55">Original module shapes</text>
    <rect x="110" y="90" width="150" height="190" rx="9" fill="url(#blueFill)" stroke="#0873f9" stroke-width="3"/><rect x="360" y="90" width="150" height="190" rx="9" fill="url(#coralFill)" stroke="#0873f9" stroke-width="3"/>
    <text x="185" y="145" font-size="25" font-weight="700" fill="#102a55">SH19</text><text x="435" y="145" font-size="25" font-weight="700" fill="#102a55">SH7</text><text x="185" y="205" font-size="23" font-weight="700" fill="#087C62">TU=77.2%</text><text x="435" y="205" font-size="23" font-weight="700" fill="#087C62">TU=77.2%</text>
    <path d="M310 300v54" stroke="#0873f9" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="394" font-size="25" font-weight="700" fill="#102a55">Reshaped · same area</text>
    <rect x="50" y="430" width="228" height="125" rx="9" fill="url(#blueFill)" stroke="#0873f9" stroke-width="3"/><rect x="342" y="430" width="228" height="125" rx="9" fill="url(#coralFill)" stroke="#0873f9" stroke-width="3"/>
    <text x="164" y="478" font-size="25" font-weight="700" fill="#102a55">SH19</text><text x="456" y="478" font-size="25" font-weight="700" fill="#102a55">SH7</text><text x="164" y="522" font-size="22" font-weight="700" fill="#087C62">TU=77.2%</text><text x="456" y="522" font-size="22" font-weight="700" fill="#087C62">TU=77.2%</text>
    <text x="310" y="620" font-size="19" fill="#58708e">Shape changes; target utilization is preserved</text>
  </g>
</svg>
