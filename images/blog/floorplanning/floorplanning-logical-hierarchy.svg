    <g fill="url(#greenFill)" stroke="#247B58" stroke-width="2.5"><rect x="94" y="392" width="72" height="44" rx="7" fill="url(#mintFill)"/><rect x="334" y="392" width="72" height="44" rx="7" fill="url(#amberFill)"/><rect x="514" y="392" width="72" height="44" rx="7" fill="url(#coralFill)"/><rect x="694" y="392" width="72" height="44" rx="7" fill="url(#cyanFill)"/><rect x="784" y="392" width="72" height="44" rx="7" fill="url(#violetFill)"/><rect x="964" y="392" width="72" height="44" rx="7" fill="url(#greenFill)"/></g>
