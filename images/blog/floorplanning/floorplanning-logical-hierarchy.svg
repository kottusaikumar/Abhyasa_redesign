  <title id="title">Logical hierarchy under TTT</title>
  <desc id="desc">TTT branches to AAA, BBB, and one combined U5, U7 leaf box. AAA branches to CCC, DDD, EEE, which contain U0, U4, U1. BBB branches to FFF, GGG, HHH, which contain U2, U3, U6.</desc>
