    <path d="M250 206v34H130v27M250 240h120v27M250 240h300v27"/>
    <path d="M640 206v34H730v27M640 240h180v27M640 240h360v27"/>
    <path d="M130 350v42M370 350v42M550 350v42M730 350v42M820 350v42M1000 350v42"/>
  </g>
