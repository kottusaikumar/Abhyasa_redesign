  <title id="title">Instance hierarchy before and after grouping B and F</title>
  <desc id="desc">Before: TOP contains A and D; A contains B and C; D contains E and F. After: TOP contains A, D and group_A; A contains C; D contains E; group_A contains B and F.</desc>
