<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-labelledby="title desc"><defs><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FCFF"/><stop offset="0.55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#E5F3FF"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F9FF"/></linearGradient><linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8E6FF"/><stop offset="1" stop-color="#8BC5FF"/></linearGradient><linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8F4FA"/><stop offset="1" stop-color="#75D5E7"/></linearGradient><linearGradient id="mintFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7F8E8"/><stop offset="1" stop-color="#8EE2B9"/></linearGradient><linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAB8"/><stop offset="1" stop-color="#FFC86B"/></linearGradient><linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DDFF"/><stop offset="1" stop-color="#B99BFF"/></linearGradient><linearGradient id="coralFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE1DC"/><stop offset="1" stop-color="#FFAAA2"/></linearGradient><filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#346da5" flood-opacity="0.12"/></filter><linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1557C0"/><stop offset="1" stop-color="#0D43AE"/></linearGradient><linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF6DF"/><stop offset="1" stop-color="#7AD9A5"/></linearGradient><linearGradient id="lavenderFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DCFF"/><stop offset="1" stop-color="#B99CFA"/></linearGradient></defs>
  <title id="title">Spacing between pairs of standard-cell rows</title>
  <desc id="desc">Four horizontal rows form two adjacent pairs. The row spacing dimension is marked in the gap between the pairs.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0l8 4-8 4z" fill="#0873f9"/></marker></defs>
  <rect width="520" height="400" rx="16" fill="url(#canvas)"/>
  <g fill="url(#blueFill)" stroke="#356A9F" stroke-width="2">
    <rect x="60" y="54" width="300" height="68"/><rect x="60" y="122" width="300" height="68" fill="url(#cyanFill)" stroke="#257B92"/>
    <rect x="60" y="230" width="300" height="68" fill="url(#violetFill)" stroke="#6650AA"/><rect x="60" y="298" width="300" height="68" fill="url(#lavenderFill)" stroke="#6650AA"/>
  </g>
  <g stroke="#91BCE8" stroke-width="1"><path d="M120 54v136M180 54v136M240 54v136M300 54v136M120 230v136M180 230v136M240 230v136M300 230v136"/></g>
  <text x="390" y="101" font-family="Arial,sans-serif" font-size="17" fill="#58708e">Row pair 1</text><text x="390" y="277" font-family="Arial,sans-serif" font-size="17" fill="#58708e">Row pair 2</text>
  <path d="M377 190v40" stroke="#0873f9" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M365 190h22M365 230h22" stroke="#0873f9" stroke-width="2"/>
  <text x="397" y="207" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#102a55">row spacing</text>
</svg>
