<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc"><defs><linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FCFF"/><stop offset="0.55" stop-color="#EDF6FF"/><stop offset="1" stop-color="#E5F3FF"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F9FF"/></linearGradient><linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8E6FF"/><stop offset="1" stop-color="#8BC5FF"/></linearGradient><linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8F4FA"/><stop offset="1" stop-color="#75D5E7"/></linearGradient><linearGradient id="mintFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D7F8E8"/><stop offset="1" stop-color="#8EE2B9"/></linearGradient><linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAB8"/><stop offset="1" stop-color="#FFC86B"/></linearGradient><linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9DDFF"/><stop offset="1" stop-color="#B99BFF"/></linearGradient><linearGradient id="coralFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE1DC"/><stop offset="1" stop-color="#FFAAA2"/></linearGradient><filter id="softShadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#346da5" flood-opacity="0.12"/></filter><linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1557C0"/><stop offset="1" stop-color="#0D43AE"/></linearGradient><linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFF6DF"/><stop offset="1" stop-color="#7AD9A5"/></linearGradient><linearGradient id="lavenderFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6DCFF"/><stop offset="1" stop-color="#B99CFA"/></linearGradient></defs>
  <title id="title">Module B rectilinear boundary from two boxes</title>
  <desc id="desc">Two coordinate-defined rectangles share the edge at y equals 720.7. Their union is a stepped rectilinear Module B boundary, not a filled enclosing rectangle.</desc>
  <rect width="800" height="430" rx="18" fill="url(#canvas)"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#102a55">Module B · two-box rectilinear boundary</text>
  <path d="M168 330V235H445V95H630V330Z" fill="url(#mintFill)" fill-rule="evenodd" stroke="#0873f9" stroke-width="4"/>
  <rect x="168" y="235" width="462" height="95" fill="url(#amberFill)" fill-opacity=".94" stroke="#45698f" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="445" y="95" width="185" height="140" fill="url(#violetFill)" fill-opacity=".94" stroke="#0873f9" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M168 350v20M630 350v20M168 362h462" stroke="#58708e" stroke-width="2"/><text x="399" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#58708e">Box 1: (356.46, 532.6) to (692.50, 720.7)</text>
  <text x="538" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#075bd7">Box 2: (483.46, 720.7) to (692.50, 934.67)</text>
  <text x="445" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a55">shared edge · y=720.7</text>
</svg>
