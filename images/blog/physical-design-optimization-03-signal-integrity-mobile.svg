<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 690" role="img" aria-labelledby="title desc">
 <title id="title">Crosstalk between adjacent routes</title><desc id="desc">Two adjacent routes show coupling arrows between them. Three readable response panels name routing optimization, shielding, and careful placement.</desc>
 <rect width="420" height="690" rx="22" fill="#f5faff"/><text x="24" y="43" fill="#15345c" font-family="Arial,sans-serif" font-size="22" font-weight="700">Signal integrity</text><text x="24" y="72" fill="#607b98" font-family="Arial,sans-serif" font-size="15">Adjacent routes can couple</text>
 <rect x="18" y="94" width="384" height="249" rx="16" fill="#fff" stroke="#d9e8f5" stroke-width="2"/><text x="38" y="129" fill="#45627f" font-family="Arial,sans-serif" font-size="16" font-weight="700">Closely spaced conductors</text>
 <path d="M48 190h324" stroke="#247fca" stroke-width="22" stroke-linecap="round"/><path d="M48 267h324" stroke="#7d62c8" stroke-width="22" stroke-linecap="round"/><text x="48" y="169" fill="#25699f" font-family="Arial,sans-serif" font-size="15" font-weight="700">Aggressor route</text><text x="48" y="309" fill="#6850a8" font-family="Arial,sans-serif" font-size="15" font-weight="700">Victim route</text>
 <path d="M143 204v44m0-44 12 13m-12-13-12 13M210 204v44m0-44 12 13m-12-13-12 13M277 204v44m0-44 12 13m-12-13-12 13" fill="none" stroke="#d97579" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="222" width="220" height="27" rx="13" fill="#fff"/><text x="210" y="241" text-anchor="middle" fill="#9b555a" font-family="Arial,sans-serif" font-size="14" font-weight="700">crosstalk / coupling</text>
 <text x="24" y="385" fill="#15345c" font-family="Arial,sans-serif" font-size="17" font-weight="700">Design responses</text>
 <rect x="18" y="404" width="384" height="70" rx="13" fill="#eaf4ff" stroke="#cfe3f5"/><circle cx="55" cy="439" r="18" fill="#d4eaff"/><path d="M45 439h20m-10-10v20" stroke="#277bcc" stroke-width="3" stroke-linecap="round"/><text x="88" y="435" fill="#24496e" font-family="Arial,sans-serif" font-size="16" font-weight="700">Optimize routing</text><text x="88" y="456" fill="#5a7691" font-family="Arial,sans-serif" font-size="14">Plan wire paths carefully</text>
 <rect x="18" y="487" width="384" height="70" rx="13" fill="#e9f7ef" stroke="#d1ebdc"/><path d="M55 506v37" stroke="#378c5a" stroke-width="9"/><path d="M45 519h20m-20 10h20" stroke="#fff" stroke-width="2"/><text x="88" y="518" fill="#2e6547" font-family="Arial,sans-serif" font-size="16" font-weight="700">Use shielding</text><text x="88" y="539" fill="#5a7d68" font-family="Arial,sans-serif" font-size="14">Separate sensitive routes</text>
 <rect x="18" y="570" width="384" height="70" rx="13" fill="#fff2e2" stroke="#f0dfc7"/><rect x="41" y="592" width="18" height="18" rx="4" fill="#f3c982"/><rect x="64" y="592" width="18" height="18" rx="4" fill="#9ad5b1"/><rect x="87" y="592" width="18" height="18" rx="4" fill="#c6b2ef"/><text x="122" y="601" fill="#755528" font-family="Arial,sans-serif" font-size="16" font-weight="700">Plan component placement</text><text x="122" y="622" fill="#87704b" font-family="Arial,sans-serif" font-size="14">Reduce unwanted proximity</text>
 <text x="210" y="667" text-anchor="middle" fill="#607b98" font-family="Arial,sans-serif" font-size="13">Responses help minimize interference.</text>
