<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc">
<title id="title">Compact FinFET device illustration</title>
<desc id="desc">Conceptual FinFET with a raised silicon fin from source to drain and a gate crossing its middle, covering its top and sidewalls.</desc>
<defs>
