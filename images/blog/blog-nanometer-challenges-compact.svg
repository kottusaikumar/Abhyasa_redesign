<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc">
  <title id="title">Nanometer design challenges: compact illustration</title>
  <desc id="desc">Conceptual off-state MOS transistor cross-section with labeled gate, source, drain, leakage path, and gate-edge process variation.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#f2f4ef"/></linearGradient>
    <linearGradient id="silicon" x2="0" y2="1"><stop stop-color="#d5e6e5"/><stop offset="1" stop-color="#a9c6c8"/></linearGradient>
    <linearGradient id="gate" x2="0" y2="1"><stop stop-color="#e5a48e"/><stop offset="1" stop-color="#c97563"/></linearGradient>
    <linearGradient id="doped" x2="0" y2="1"><stop stop-color="#a9d1d3"/><stop offset="1" stop-color="#78acb0"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#bd713b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="930" height="600" fill="url(#paper)"/>
  <path d="M0 492c182-42 316-17 465 13s293 31 465-7v102H0z" fill="#e9efea" opacity=".55"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#102d62">
    <text x="58" y="135" font-size="38">OFF-STATE</text>
    <text x="58" y="178" font-size="38">LEAKAGE</text>
    <text x="676" y="135" font-size="37">PROCESS</text>
    <text x="676" y="177" font-size="37">VARIATION</text>
    <text x="465" y="75" text-anchor="middle" font-size="44">Gate</text>
  </g>
  <path d="M465 83v61" stroke="#36536c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="m458 133 7 12 7-12" fill="none" stroke="#36536c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="465" cy="520" rx="375" ry="18" fill="#58747b" opacity=".12"/>
  <rect x="88" y="280" width="754" height="226" rx="17" fill="url(#silicon)" stroke="#587983" stroke-width="4"/>
  <path d="M104 292h287v100c-90-9-178-4-287 2z" fill="url(#doped)" stroke="#5c8d95" stroke-width="3"/>
  <path d="M539 292h287v102c-109-6-197-11-287-2z" fill="url(#doped)" stroke="#5c8d95" stroke-width="3"/>
  <path d="M405 287c45 9 75 9 120 0" fill="none" stroke="#688a8f" stroke-width="4" stroke-dasharray="8 10"/>
  <rect x="390" y="258" width="150" height="30" rx="5" fill="#fff6df" stroke="#b18f67" stroke-width="4"/>
  <path d="M405 150h120v108H405z" fill="url(#gate)" stroke="#805c5b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M417 163h95" stroke="#f4c6b0" stroke-width="5" stroke-linecap="round"/>
  <path d="M548 153v108" fill="none" stroke="#8e82a8" stroke-width="5" stroke-dasharray="11 10" stroke-linecap="round"/>
  <path d="M666 186c-43 1-82-6-111-18" fill="none" stroke="#70698c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="m567 163-12 5 7 11" fill="none" stroke="#70698c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M391 354h148" stroke="#bd713b" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 17" marker-end="url(#arrow)"/>
  <path d="M173 190c7 66 92 97 208 148" fill="none" stroke="#bd713b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="m370 326 11 12-15 3" fill="none" stroke="#bd713b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" text-anchor="middle" fill="#18395b">
    <text x="247" y="458">Source</text>
    <text x="687" y="458">Drain</text>
  </g>
</svg>
