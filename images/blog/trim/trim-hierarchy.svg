<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">Hierarchy flattening and name mapping</title><desc id="desc">In the Cadence guide example, two instances that share leaf name i1 under different paths become flat names i1 and i1_uniquify1. A mapping file records original and modified names.</desc>
<rect width="600" height="350" rx="18" fill="#eef7ff"/><text x="26" y="37" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#10345d">Original hierarchical names</text><text x="354" y="37" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#10345d">Trimmed flat names</text>
<rect x="24" y="60" width="224" height="195" rx="13" fill="#f7f4ff" stroke="#b6a7e4" stroke-width="2"/><rect x="352" y="60" width="224" height="195" rx="13" fill="#eefaf5" stroke="#9ad5b3" stroke-width="2"/>
<rect x="48" y="82" width="175" height="56" rx="8" fill="#dcd1fa" stroke="#785ab4" stroke-width="2"/><text x="64" y="116" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#42336e">h1/h2/i1</text>
<rect x="48" y="161" width="175" height="56" rx="8" fill="#e7d8fa" stroke="#9162b7" stroke-width="2"/><text x="64" y="195" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#42336e">h1/h4/i1</text>
<path d="M263 110h72M263 189h72" fill="none" stroke="#277dbd" stroke-width="4"/><path d="m324 100 12 10-12 10m0 59 12 10-12 10" fill="none" stroke="#277dbd" stroke-width="4"/>
<rect x="372" y="82" width="181" height="56" rx="8" fill="#c8efd9" stroke="#278b60" stroke-width="2"/><text x="390" y="116" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#175e46">i1</text>
<rect x="372" y="161" width="181" height="56" rx="8" fill="#c8efd9" stroke="#278b60" stroke-width="2"/><text x="384" y="195" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#175e46">i1_uniquify1</text>
<rect x="24" y="275" width="552" height="53" rx="10" fill="#fff6e6" stroke="#dfad54" stroke-width="2"/><text x="42" y="308" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#855516">Example mapping: original → modified names</text>
</svg>
