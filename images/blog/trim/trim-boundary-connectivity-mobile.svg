<rect x="207" y="443" width="72" height="49" rx="7" fill="#8eddbb" stroke="#258c66" stroke-width="2"/>
<text x="219" y="473" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#165e47">Cell</text>
<path d="M86 468h121" fill="none" stroke="#d48613" stroke-width="6"/>
