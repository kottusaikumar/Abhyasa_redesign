<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">Flattened instance names, narrow layout</title><desc id="desc">In the Cadence guide example, qualified names h1/h2/i1 and h1/h4/i1 become i1 and i1_uniquify1 in the trimmed design, with a mapping file.</desc>
