<linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#f1f4ee"/></linearGradient>
<linearGradient id="base" x2="0" y2="1"><stop stop-color="#d3e5e4"/><stop offset="1" stop-color="#a9c6c8"/></linearGradient>
<linearGradient id="fin" x2="0" y2="1"><stop stop-color="#a9d4cd"/><stop offset="1" stop-color="#78aaa5"/></linearGradient>
<linearGradient id="gate" x2="0" y2="1"><stop stop-color="#b9a6d1"/><stop offset="1" stop-color="#81729f"/></linearGradient>
<marker id="navyArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8" fill="none" stroke="#36536c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
