<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 561" role="img" aria-labelledby="title desc">
<title id="title">FinFET gate controls a raised silicon fin from three sides</title>
<desc id="desc">Conceptual FinFET. A raised silicon fin runs from source on the left to drain on the right. The gate crosses the fin at its center and wraps its top and both sidewalls; the channel lies in the fin beneath the gate.</desc>
