<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc">
<title id="title">AI-assisted VLSI design exploration at compact card size</title>
<desc id="desc">Two schematic floorplan alternatives lead to a larger layout. Below it, power, timing, and area are shown as separate evaluation constraints in an iterative design process.</desc>
<defs>
 <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#f1f4ee"/></linearGradient>
 <linearGradient id="main" x2="0" y2="1"><stop stop-color="#fafdff"/><stop offset="1" stop-color="#e8f2f3"/></linearGradient>
 <filter id="shadow" x="-20%" y="-25%" width="145%" height="165%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2c4d5b" flood-opacity=".12"/></filter>
 <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2 10 6 2 10" fill="none" stroke="#588997" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="930" height="600" fill="url(#paper)"/>
<path d="M0 539c193-32 342 10 465 8 156-2 303-29 465-6v59H0z" fill="#e9efea" opacity=".65"/>
<text x="465" y="57" text-anchor="middle" fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" letter-spacing=".7">AI-ASSISTED DESIGN EXPLORATION</text>

<!-- The two small sheets are alternatives, not stacked chip dies. -->
<g filter="url(#shadow)"><rect x="65" y="136" width="232" height="183" rx="13" fill="#eff4f5" stroke="#9bb3be" stroke-width="4"/><rect x="95" y="113" width="231" height="183" rx="13" fill="#fafcfc" stroke="#809da9" stroke-width="4"/></g>
<g fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="1"><text x="112" y="144">LAYOUT OPTIONS</text></g>
<rect x="114" y="162" width="190" height="111" rx="5" fill="#f8fbfb" stroke="#afc4c7" stroke-width="2"/>
<g stroke-width="2.5"><rect x="126" y="175" width="66" height="38" rx="3" fill="#d7e8f1" stroke="#80a6ba"/><rect x="205" y="175" width="86" height="48" rx="3" fill="#e6ddef" stroke="#a18dba"/><rect x="126" y="226" width="86" height="36" rx="3" fill="#d0e8dd" stroke="#75a393"/><rect x="224" y="236" width="67" height="26" rx="3" fill="#d7e8f1" stroke="#80a6ba"/></g>
<path d="M193 195h12m7 49h12" stroke="#688f9b" stroke-width="3" stroke-linecap="round"/>
<g opacity=".7" fill="#d7e8f1" stroke="#80a6ba" stroke-width="2"><rect x="82" y="187" width="25" height="40" rx="2"/><rect x="82" y="236" width="25" height="45" rx="2"/></g>
<path d="M337 216h46" fill="none" stroke="#588997" stroke-width="5" marker-end="url(#arrow)"/>

<!-- One reviewed schematic layout; macro blocks and orthogonal routes are intentionally simplified. -->
<g filter="url(#shadow)"><rect x="397" y="96" width="465" height="274" rx="18" fill="url(#main)" stroke="#5d8190" stroke-width="5"/><path d="M397 353h465l-20 19H417z" fill="#a8c5cf" stroke="#5d8190" stroke-width="3"/></g>
<text x="423" y="129" fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="1">REVIEWED FLOORPLAN</text>
<rect x="421" y="146" width="415" height="185" rx="7" fill="#f8fbfa" stroke="#abc0c3" stroke-width="2.5"/>
<g stroke="#d9e4e2" stroke-width="2"><path d="M455 146v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185m34-185v185M421 181h415m-415 35h415m-415 35h415m-415 35h415"/></g>
<g stroke-width="3"><rect x="440" y="165" width="115" height="62" rx="5" fill="#c9e1f0" stroke="#628eae"/><rect x="572" y="165" width="103" height="62" rx="5" fill="#e4d8ef" stroke="#8e7cae"/><rect x="694" y="165" width="119" height="144" rx="5" fill="#c8e4d9" stroke="#6b9e91"/><rect x="440" y="244" width="130" height="65" rx="5" fill="#c8e4d9" stroke="#6b9e91"/><rect x="586" y="244" width="89" height="65" rx="5" fill="#c9e1f0" stroke="#628eae"/></g>
<g fill="none" stroke="#5f9297" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M555 196h17m103 0h19M570 277h16m89 0h19M505 227v17m135 0v-17"/></g>

<path d="M699 382v24" fill="none" stroke="#588997" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="87" y="419" width="757" height="130" rx="18" fill="#fdfefe" stroke="#91abb5" stroke-width="3"/></g>
<text x="111" y="451" fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">PPA REVIEW</text>
<g fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><text x="116" y="491">POWER</text><text x="378" y="491">TIMING</text><text x="648" y="491">AREA</text></g>
<g fill="#ebf0f2" stroke="#cadbdf" stroke-width="1.5"><rect x="115" y="509" width="191" height="22" rx="11"/><rect x="377" y="509" width="191" height="22" rx="11"/><rect x="647" y="509" width="166" height="22" rx="11"/></g>
<g><rect x="115" y="509" width="107" height="22" rx="11" fill="#b4dacd"/><rect x="377" y="509" width="132" height="22" rx="11" fill="#c6d8ec"/><rect x="647" y="509" width="87" height="22" rx="11" fill="#ddd1eb"/></g>
<g fill="#fff" stroke="#537b89" stroke-width="2.5"><circle cx="222" cy="520" r="8"/><circle cx="509" cy="520" r="8"/><circle cx="734" cy="520" r="8"/></g>
<text x="465" y="582" text-anchor="middle" fill="#527889" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">ITERATE · EVALUATE · REFINE</text>
</svg>
