<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-labelledby="title desc">
 <title id="title">Specialized EDA for sub-10nm design complexity</title><desc id="desc">Quantum effects and parasitic effects feed into specialized EDA tools that incorporate machine learning and AI to support placement and routing.</desc>
