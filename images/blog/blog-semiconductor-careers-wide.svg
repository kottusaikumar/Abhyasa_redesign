 <g fill="#a4c6d6" stroke="#466a87" stroke-width="2"><rect x="59" y="60" width="20" height="20" rx="3"/><rect x="91" y="86" width="22" height="23" rx="3"/><rect x="121" y="113" width="20" height="20" rx="3"/></g>
