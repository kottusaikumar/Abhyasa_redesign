<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 561" role="img" aria-labelledby="title desc">
<title id="title">Five paths in semiconductor engineering</title>
<desc id="desc">Five distinct technical work symbols show chip design, functional verification, analog and mixed-signal design, design for test, and wafer fabrication. They are specializations within one industry, not steps in a required career sequence.</desc>
