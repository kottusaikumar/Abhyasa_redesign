<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
 <title id="title">Process variation at narrow widths</title><desc id="desc">A mobile-friendly illustration compares narrow, nominal, and wider line profiles, material variation, and the effect on circuit predictability.</desc>
 <rect width="420" height="620" rx="22" fill="#f5faff"/><text x="24" y="43" fill="#15345c" font-family="Arial,sans-serif" font-size="22" font-weight="700">Feature variation</text><text x="24" y="72" fill="#607b98" font-family="Arial,sans-serif" font-size="15">Conceptual · not to scale</text>
 <rect x="18" y="91" width="384" height="229" rx="16" fill="#fff" stroke="#d9e8f5" stroke-width="2"/><text x="38" y="124" fill="#385879" font-family="Arial,sans-serif" font-size="17" font-weight="700">Line width and thickness</text>
 <text x="39" y="169" fill="#55718d" font-family="Arial,sans-serif" font-size="15">Narrow</text><path d="M129 163h238" stroke="#3989d5" stroke-width="9" stroke-linecap="round"/>
 <text x="39" y="225" fill="#55718d" font-family="Arial,sans-serif" font-size="15">Nominal</text><path d="M129 219h238" stroke="#7b68ce" stroke-width="17" stroke-linecap="round"/>
 <text x="39" y="281" fill="#55718d" font-family="Arial,sans-serif" font-size="15">Wider</text><path d="M129 275h238" stroke="#e99b35" stroke-width="26" stroke-linecap="round"/>
 <rect x="18" y="339" width="384" height="123" rx="16" fill="#fff" stroke="#d9e8f5" stroke-width="2"/><text x="38" y="373" fill="#385879" font-family="Arial,sans-serif" font-size="17" font-weight="700">Material properties vary too</text><rect x="40" y="393" width="97" height="33" rx="7" fill="#dceaff" stroke="#3989d5" stroke-width="2"/><rect x="160" y="393" width="97" height="33" rx="7" fill="#e7ddff" stroke="#8a67d8" stroke-width="2"/><rect x="280" y="393" width="97" height="33" rx="7" fill="#ffe8cf" stroke="#e99b35" stroke-width="2"/><text x="88" y="449" text-anchor="middle" fill="#526f8c" font-family="Arial,sans-serif" font-size="14">Profile A</text><text x="208" y="449" text-anchor="middle" fill="#526f8c" font-family="Arial,sans-serif" font-size="14">Profile B</text><text x="328" y="449" text-anchor="middle" fill="#526f8c" font-family="Arial,sans-serif" font-size="14">Profile C</text>
 <rect x="18" y="481" width="384" height="116" rx="16" fill="#e8f3ff"/><circle cx="55" cy="519" r="16" fill="#2f80d5"/><path d="M55 509v20m-7-10h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="84" y="516" fill="#193b63" font-family="Arial,sans-serif" font-size="17" font-weight="700">Why it matters</text><text x="38" y="551" fill="#526f8c" font-family="Arial,sans-serif" font-size="15">Variation affects circuit predictability.</text><text x="38" y="576" fill="#526f8c" font-family="Arial,sans-serif" font-size="15">Statistical modeling helps assess it.</text>
</svg>
