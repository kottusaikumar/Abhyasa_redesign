<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Process variation in physical design</title><desc id="desc">Three repeated conductor features with visibly different widths and thicknesses, alongside material swatches, illustrate variation without implying measured values.</desc>
  <defs><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f7fd"/></linearGradient></defs>
  <rect x="1" y="1" width="758" height="498" rx="22" fill="url(#panel)" stroke="#d9e8f5" stroke-width="2"/><text x="42" y="53" fill="#15345c" font-family="Arial,sans-serif" font-size="22" font-weight="700">Feature variation across a process</text><text x="42" y="82" fill="#607b98" font-family="Arial,sans-serif" font-size="14">Conceptual illustration · dimensions not to scale</text>
  <text x="45" y="135" fill="#385879" font-family="Arial,sans-serif" font-size="15" font-weight="700">Line width</text>
  <g stroke="#234c7b" stroke-width="3"><rect x="48" y="157" width="196" height="32" rx="5" fill="#80b5f4"/><rect x="48" y="213" width="196" height="22" rx="5" fill="#a7d1ff"/><rect x="48" y="259" width="196" height="42" rx="5" fill="#648fdb"/></g>
  <path d="M66 326h162" stroke="#9bb4cb" stroke-width="2" stroke-dasharray="6 6"/><text x="49" y="352" fill="#637d98" font-family="Arial,sans-serif" font-size="13">Same intended feature · differing profile</text>
  <text x="293" y="135" fill="#385879" font-family="Arial,sans-serif" font-size="15" font-weight="700">Material properties</text>
  <g><rect x="296" y="158" width="112" height="142" rx="10" fill="#e4effa" stroke="#7ea7ce" stroke-width="2"/><path d="M313 190h78m-78 17h78m-78 17h78m-78 17h78m-78 17h78" stroke="#6e9bca" stroke-width="5" stroke-linecap="round"/><text x="352" y="326" text-anchor="middle" fill="#526f8c" font-family="Arial,sans-serif" font-size="13">Profile A</text></g>
  <g><rect x="426" y="158" width="112" height="142" rx="10" fill="#f5eafa" stroke="#ad82ca" stroke-width="2"/><path d="M443 190h78m-78 17h78m-78 17h78m-78 17h78m-78 17h78" stroke="#9a70bb" stroke-width="5" stroke-linecap="round"/><text x="482" y="326" text-anchor="middle" fill="#75568e" font-family="Arial,sans-serif" font-size="13">Profile B</text></g>
  <rect x="568" y="147" width="151" height="190" rx="14" fill="#eef6ff" stroke="#d4e4f2"/><circle cx="604" cy="184" r="9" fill="#3287e7"/><circle cx="637" cy="184" r="9" fill="#8a67d8"/><circle cx="670" cy="184" r="9" fill="#e99b35"/><text x="586" y="221" fill="#385879" font-family="Arial,sans-serif" font-size="13" font-weight="700">Variation can change</text><text x="586" y="244" fill="#526f8c" font-family="Arial,sans-serif" font-size="13">circuit behavior</text><path d="M586 264h115" stroke="#cfdeeb"/><text x="586" y="292" fill="#385879" font-family="Arial,sans-serif" font-size="13" font-weight="700">Model statistically</text><text x="586" y="314" fill="#526f8c" font-family="Arial,sans-serif" font-size="13">to assess effects</text>
  <rect x="44" y="390" width="675" height="70" rx="12" fill="#e8f3ff"/><circle cx="75" cy="425" r="13" fill="#2f80d5"/><path d="M75 416v18m-7-9h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><text x="102" y="421" fill="#193b63" font-family="Arial,sans-serif" font-size="15" font-weight="700">Design implication</text><text x="102" y="443" fill="#526f8c" font-family="Arial,sans-serif" font-size="14">Account for manufacturing variation when predicting performance and power.</text>
</svg>
