<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
 <title id="title">Leakage current and thermal management</title><desc id="desc">A conceptual off-state transistor shows a small leakage path from supply toward ground, leading to idle power loss and heat. Power gating, voltage scaling, and FinFET architecture are listed as source article approaches.</desc>
