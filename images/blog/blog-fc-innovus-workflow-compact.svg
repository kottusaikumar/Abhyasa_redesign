<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc">
<title id="title">Fusion Compiler and Innovus share a design-inspection goal</title>
<desc id="desc">Separate Fusion Compiler and Innovus task cards point to the same conceptual physical-design layout. Their commands are tool-specific, not interchangeable.</desc>
<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbf8f0"/><stop offset="1" stop-color="#f1f4ee"/></linearGradient>
  <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#335363" flood-opacity=".12"/></filter>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M2 2 10 6 2 10" fill="none" stroke="#53788a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="930" height="600" fill="url(#paper)"/>
<path d="M0 518c180-27 312-17 465 5 161 23 306-24 465-4v81H0z" fill="#e8efea" opacity=".6"/>
<text x="465" y="68" text-anchor="middle" fill="#102d62" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700">SAME TASK · DIFFERENT TOOLS</text>

<g filter="url(#shadow)">
  <rect x="42" y="105" width="397" height="270" rx="24" fill="#f9f8fb" stroke="#b8accd" stroke-width="4"/>
  <rect x="491" y="105" width="397" height="270" rx="24" fill="#f3f9f8" stroke="#9fbfbc" stroke-width="4"/>
  <rect x="288" y="412" width="354" height="157" rx="20" fill="#f8fcf9" stroke="#6d9698" stroke-width="4"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#102d62" font-weight="700">
  <text x="240" y="157" font-size="36">FUSION COMPILER</text>
  <text x="690" y="157" font-size="36">INNOVUS</text>
  <text x="465" y="548" font-size="36">INSPECT DESIGN</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#18395b">
  <rect x="76" y="185" width="329" height="70" rx="14" fill="#eee8f4" stroke="#c5b8d7" stroke-width="2"/>
  <rect x="76" y="270" width="329" height="70" rx="14" fill="#eee8f4" stroke="#c5b8d7" stroke-width="2"/>
  <rect x="525" y="185" width="329" height="70" rx="14" fill="#e5f1ed" stroke="#afd0c9" stroke-width="2"/>
  <rect x="525" y="270" width="329" height="70" rx="14" fill="#e5f1ed" stroke="#afd0c9" stroke-width="2"/>
  <text x="240" y="230">Open design</text><text x="240" y="315">Find cells</text>
  <text x="690" y="230">Open design</text><text x="690" y="315">Find cells</text>
</g>
<path d="M241 378v18c0 13 29 22 41 22" fill="none" stroke="#53788a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M689 378v18c0 13-29 22-41 22" fill="none" stroke="#53788a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<!-- Conceptual layout grid, not an EDA application screenshot. -->
<rect x="337" y="427" width="256" height="92" rx="9" fill="#e8f1ed" stroke="#8aada8" stroke-width="2"/>
<g fill="#bed8d1" stroke="#7ea7a1" stroke-width="1.5">
  <rect x="350" y="440" width="41" height="24" rx="2"/><rect x="398" y="440" width="41" height="24" rx="2"/><rect x="446" y="440" width="41" height="24" rx="2"/><rect x="494" y="440" width="41" height="24" rx="2"/><rect x="542" y="440" width="38" height="24" rx="2"/>
  <rect x="350" y="474" width="41" height="25" rx="2"/><rect x="398" y="474" width="41" height="25" rx="2"/><rect x="494" y="474" width="41" height="25" rx="2"/><rect x="542" y="474" width="38" height="25" rx="2"/>
</g>
<rect x="448" y="468" width="41" height="35" rx="4" fill="#f8e7cb" stroke="#b69a73" stroke-width="2"/>
</svg>
